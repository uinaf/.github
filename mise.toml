[tools]
actionlint = "1.7.12"
"pipx:zizmor" = "1.30.1"

[tasks.verify-actions]
description = "Lint and audit the shared workflows"
sources = [".github/**/*.yml", ".github/**/*.yaml"]
run = '''
actionlint
# Online audits (ref-version-mismatch among them) need a token, as in CI.
GH_TOKEN="${GH_TOKEN:-$(gh auth token)}" zizmor .github/workflows .github/actions
'''

[tasks.verify]
description = "Verify changed organization policy"
depends = ["verify-actions"]
run = "git diff --check"
