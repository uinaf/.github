[tools]
actionlint = "1.7.12"
"pipx:zizmor" = "1.30.1"

[tasks.verify-actions]
description = "Lint and audit the shared workflows and actions"
sources = [".github/**/*.yml", ".github/**/*.yaml"]
run = '''
actionlint
token="${GH_TOKEN:-$(gh auth token)}" || exit 1
GH_TOKEN="$token" zizmor .github/workflows .github/actions
'''

[tasks.verify]
description = "Verify changed organization policy"
depends = ["verify-actions"]
run = "git diff --check"
