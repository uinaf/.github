name: Classify changed paths
description: >-
  Run dorny/paths-filter with the checkout it needs for the event. Pull
  request events are classified through the API and get no checkout; every
  other event gets a default-depth checkout and the filter fetches the base
  commit itself. Filters are inline YAML from the caller workflow,
  never a file from the checked-out tree, so a pull request cannot edit its
  own lane selection. The caller job needs `pull-requests: read`, and
  `contents: read` whenever a checkout can run (every non-PR event).
inputs:
  filters:
    description: Inline paths-filter YAML.
    required: true
  full-history:
    description: >-
      Fetch full history on non-PR events. Required for a private repository
      on every non-PR event, because the checkout persists no credentials and
      the filter's own fetch of a missing base commit runs unauthenticated.
    required: false
    default: "false"
outputs:
  changes:
    description: JSON array of filter names that matched.
    value: ${{ steps.filter.outputs.changes }}
runs:
  using: composite
  steps:
    - name: Check out repository
      if: ${{ !startsWith(github.event_name, 'pull_request') }}
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        fetch-depth: ${{ inputs.full-history == 'true' && '0' || '1' }}
    - id: filter
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: ${{ inputs.filters }}
