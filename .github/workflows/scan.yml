
name: Scan

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label for every scan job. Private repositories may pass a
          Blacksmith label when GitHub-hosted Actions do not dispatch for them
          under the organization's paid-usage budget. Public repositories keep
          the GitHub-hosted default, where minutes are free.
        type: string
        required: false
        default: "ubuntu-24.04"
      zizmor-args:
        description: >-
          Extra zizmor arguments for repositories with documented needs,
          e.g. --no-online-audits when a workflow pins a private first-party
          action whose tags the repository token cannot list.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  scan:
    name: Scan
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        id: changes
        with:
          script: |
            const sha = /^[0-9a-f]{40}$/;
            let logOpts = '--all';
            let diffRange;
            if (context.eventName === 'pull_request') {
              const base = context.payload.pull_request.base.sha;
              if (!sha.test(base)) {
                throw new Error('Invalid pull request base SHA');
              }
              logOpts = `${base}..HEAD`;
              diffRange = `${base}...HEAD`;
            } else if (context.eventName === 'push') {
              const before = context.payload.before;
              if (!sha.test(before)) {
                throw new Error('Invalid push before SHA');
              }
              const { exitCode } = await exec.getExecOutput('git', [
                'merge-base', '--is-ancestor', before, 'HEAD',
              ], { ignoreReturnCode: true, silent: true });
              if (exitCode === 0) {
                logOpts = `${before}..HEAD`;
                diffRange = `${before}..HEAD`;
              }
            }
            core.setOutput('log-opts', logOpts);
            if (!diffRange) {
              core.setOutput('workflows', 'true');
              return;
            }
            const { stdout } = await exec.getExecOutput('git', [
              'diff', '--name-only', '-z', '--no-renames', diffRange, '--',
            ], { silent: true });
            const workflows = stdout.split('\0').some(path =>
              path.startsWith('.github/') ||
              /(^|\/)(action\.ya?ml|\.?zizmor\.ya?ml|\.shellcheckrc)$/.test(path)
            );
            core.setOutput('workflows', String(workflows));
      - name: Scan Git history with Gitleaks
        if: ${{ !cancelled() }}
        env:
          LOG_OPTS: ${{ steps.changes.outputs.log-opts || '--all' }}
        run: |
          set -euo pipefail
          log="$(docker run --rm --network none -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --log-opts="$LOG_OPTS" --redact --no-banner --log-level info 2>&1)" && status=0 || status=$?
          printf '%s\n' "$log"
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          commits="$(printf '%s' "$log" | sed -n 's/.*[^0-9]\([0-9][0-9]*\) commits scanned.*/\1/p' | tail -1)"
          if [ -n "${commits:-}" ] && [ "$commits" -gt 0 ]; then
            exit 0
          fi
          # Gitleaks skips commits that add no text lines, such as renames, deletions,
          # and binary changes.
          # shellcheck disable=SC2086
          added="$(git log --numstat --format= --find-renames $LOG_OPTS | awk '$1 != "-" { n += $1 } END { print n + 0 }')"
          if [ "$added" -gt 0 ]; then
            echo "gitleaks scanned no commits" >&2
            exit 1
          fi
      - name: Scan Git history with TruffleHog
        if: ${{ !cancelled() }}
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            trufflesecurity/trufflehog:3.97.6@sha256:cc1a591e83fec7bf56f64c15beaaa5d8e3d179a4165a03a087d07165296ef7df \
            git file:///repo --no-update --fail --results=verified
      - name: Lint workflows with Actionlint
        if: ${{ !cancelled() && steps.changes.outputs.workflows != 'false' }}
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
      - name: Audit workflow security with Zizmor
        if: ${{ !cancelled() && steps.changes.outputs.workflows != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZIZMOR_EXTRA_ARGS: ${{ inputs.zizmor-args }}
        run: |
          # shellcheck disable=SC2086
          docker run --rm -e GH_TOKEN -v "$PWD:/repo" \
            ghcr.io/zizmorcore/zizmor:1.29.0@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284 \
            $ZIZMOR_EXTRA_ARGS /repo
