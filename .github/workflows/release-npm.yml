# Shared npm release for uinaf packages: semantic-release with npm trusted
# publishing, an App-minted token for tag and release writes, and an
# immutable-release readback. Callers keep their own verify and scan jobs and
# their own workflow filename, because npm's trusted publisher configuration
# checks the calling workflow's name, not this file.
#
# Both the caller job and this job need `id-token: write`; the caller passes
# the App private key explicitly. Nothing here reads a registry token.

name: Release npm package

on:
  workflow_call:
    inputs:
      runner:
        description: >-
          Runner label. npm trusted publishing supports cloud-hosted runners
          only, so this stays GitHub-hosted even for private callers.
        type: string
        required: false
        default: "ubuntu-24.04"
      ref:
        description: Commit to release; defaults to the triggering commit.
        type: string
        required: false
        default: ${{ github.sha }}
      node-version-file:
        type: string
        required: false
        default: ".node-version"
      app-client-id:
        description: Client id of the GitHub App that signs release writes.
        type: string
        required: true
      semantic-version:
        description: semantic-release version to run.
        type: string
        required: false
        default: "25.0.9"
      extra-plugins:
        description: >-
          Newline-separated semantic-release plugins with exact versions. The
          default covers analysis, notes, npm, GitHub Release, and the
          Conventional Commits preset; callers with source writeback add
          their own plugins.
        type: string
        required: false
        default: |
          @semantic-release/commit-analyzer@13.0.1
          @semantic-release/release-notes-generator@14.1.1
          @semantic-release/npm@13.1.5
          @semantic-release/github@12.0.8
          conventional-changelog-conventionalcommits@9.3.1
      pack-command:
        description: >-
          Optional command run after install and before release, for packages
          whose publish does not build itself (for example `vp pack`).
        type: string
        required: false
        default: ""
      working-directory:
        description: Directory for the pack command.
        type: string
        required: false
        default: "."
    secrets:
      app-private-key:
        description: Private key of the GitHub App named by app-client-id.
        required: true

permissions: {}

jobs:
  release:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    environment:
      name: release
      deployment: false
    # Never cancel a publish mid-flight; queue instead.
    concurrency:
      group: release-${{ github.repository }}-main
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC for npm trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # semantic-release reads tag history to pick the next version.
          fetch-depth: 0
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          standalone: true
      # Secret-bearing job: no dependency cache, fresh install. vp stays on
      # PATH because npm publish's prepack runs the repository verify gate.
      - uses: voidzero-dev/setup-vp@24d870228786dc83ae73482406bdd1e7befaec14 # v1.21.0
        with:
          node-version-file: ${{ inputs.node-version-file }}
          cache: false
          run-install: |
            - args: ["--frozen-lockfile"]
      - name: Build the package
        if: inputs.pack-command != ''
        working-directory: ${{ inputs.working-directory }}
        env:
          PACK_COMMAND: ${{ inputs.pack-command }}
        run: eval "$PACK_COMMAND"
      - name: Create release bot token
        id: release-bot
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Authorize release writes
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: gh auth setup-git
      - id: release
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          semantic_version: ${{ inputs.semantic-version }}
          extra_plugins: ${{ inputs.extra-plugins }}
        env:
          GITHUB_TOKEN: ${{ steps.release-bot.outputs.token }}
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
      - name: Verify immutable release
        if: steps.release.outputs.new_release_published == 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          RELEASE_TAG: ${{ steps.release.outputs.new_release_git_tag }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq .immutable)" = true
